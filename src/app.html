<!doctype html>
<html lang="nl" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#141414" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/pwa-192x192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/satoshi-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Set the stored or browser language before first paint, so the <html lang> is right
			// for screen readers even before hydration.
			try {
				var l = localStorage.getItem('barchy.locale');
				if (l !== 'nl' && l !== 'en') l = /^nl\b/i.test(navigator.language) ? 'nl' : 'en';
				document.documentElement.lang = l;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
